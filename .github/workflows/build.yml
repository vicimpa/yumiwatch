name: Build installers
on:
  workflow_call:
    inputs:
      release:
        type: boolean
        default: false
      mobile:
        type: boolean
        default: true
permissions:
  contents: read
env:
  CARGO_INCREMENTAL: '0'
  CARGO_TERM_COLOR: always
  RELEASE_BUILD: ${{ inputs.release }}
  VITE_YANI_APPLICATION_TOKEN: ${{ vars.YANI_APPLICATION_TOKEN || secrets.YANI_APPLICATION_TOKEN }}
jobs:
  desktop:
    name: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x64
            os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            bundles: deb,rpm,appimage
          - platform: windows-x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis,msi
          - platform: macos-universal
            os: macos-15
            target: universal-apple-darwin
            bundles: app,dmg
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - name: macOS architectures
        if: runner.os == 'macOS'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev librsvg2-dev libayatana-appindicator3-dev patchelf rpm libgstreamer1.0-dev gstreamer1.0-plugins-good gstreamer1.0-plugins-bad gstreamer1.0-libav
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ${{ matrix.platform }}
      - run: npm ci
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml
      - name: Build installers
        run: node scripts/build-desktop.mjs ${{ matrix.target }} ${{ matrix.bundles }}
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      - name: Package macOS installer
        if: runner.os == 'macOS'
        shell: bash
        run: |
          VERSION=$(node -p "JSON.parse(require('fs').readFileSync('package.json','utf8')).version.split('-')[0]")
          pkgbuild --component src-tauri/target/universal-apple-darwin/release/bundle/macos/YummyWatch.app --install-location /Applications --identifier app.yumiwatch.desktop --version "$VERSION" src-tauri/target/universal-apple-darwin/release/bundle/YummyWatch.pkg
      - run: node scripts/collect-release.mjs ${{ matrix.platform }} src-tauri/target/${{ matrix.target }}/release/bundle
      - uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.platform }}
          path: release-assets/*
          if-no-files-found: error
          retention-days: 14

  android:
    if: inputs.mobile
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      NDK_VERSION: 28.2.13676358
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Android NDK
        shell: bash
        run: |
          sdkmanager "ndk;$NDK_VERSION"
          echo "NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: android
      - run: npm ci
      - run: npm run init:android
      - name: Restore Android signing key
        if: inputs.release
        env:
          ANDROID_KEY_BASE64: ${{ secrets.ANDROID_KEY_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          : "${ANDROID_KEY_BASE64:?Set ANDROID_KEY_BASE64 in repository secrets}"
          : "${ANDROID_KEY_ALIAS:?Set ANDROID_KEY_ALIAS in repository secrets}"
          : "${ANDROID_STORE_PASSWORD:?Set ANDROID_STORE_PASSWORD in repository secrets}"
          : "${ANDROID_KEY_PASSWORD:?Set ANDROID_KEY_PASSWORD in repository secrets}"
          printf '%s' "$ANDROID_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/yummywatch.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/yummywatch.jks" >> "$GITHUB_ENV"
      - name: Android debug APK
        if: ${{ !inputs.release }}
        run: npm run build:android -- --ci --debug --target aarch64 --apk -- --locked
      - name: Android release APK and AAB
        if: inputs.release
        run: npm run build:android -- --ci --target aarch64 armv7 x86_64 --apk --aab -- --locked
        env:
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      - run: node scripts/collect-release.mjs android src-tauri/gen/android/app/build/outputs
      - uses: actions/upload-artifact@v4
        with:
          name: installers-android
          path: release-assets/*
          if-no-files-found: error
          retention-days: 14
      - name: Remove upload key
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/yummywatch.jks"

  ios:
    if: inputs.mobile
    runs-on: macos-15
    timeout-minutes: 60
    env:
      # A real team is required only for device release signing.
      APPLE_DEVELOPMENT_TEAM: ${{ vars.APPLE_DEVELOPMENT_TEAM || '0000000000' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ios
      - run: npm ci
      - name: iOS build tools
        run: |
          command -v xcodegen || brew install xcodegen
          command -v pod || brew install cocoapods
      - run: npm run init:ios
      - name: Build simulator app
        if: ${{ !inputs.release }}
        run: npm run build:ios -- --ci --target aarch64-sim --no-sign -- --locked
      - name: Archive simulator app
        if: ${{ !inputs.release }}
        shell: bash
        run: |
          APP=$(find src-tauri/gen/apple/build -type d -name 'YummyWatch.app' -print -quit)
          test -n "$APP"
          mkdir -p ios-output
          ditto -c -k --keepParent "$APP" ios-output/YummyWatch-simulator.zip
      - name: Build signed iOS IPA
        if: inputs.release
        env:
          IOS_CERTIFICATE: ${{ secrets.IOS_CERTIFICATE }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_MOBILE_PROVISION: ${{ secrets.IOS_MOBILE_PROVISION }}
        shell: bash
        run: |
          test "$APPLE_DEVELOPMENT_TEAM" != 0000000000
          : "${IOS_CERTIFICATE:?Set IOS_CERTIFICATE in repository secrets}"
          : "${IOS_CERTIFICATE_PASSWORD:?Set IOS_CERTIFICATE_PASSWORD in repository secrets}"
          : "${IOS_MOBILE_PROVISION:?Set IOS_MOBILE_PROVISION in repository secrets}"
          npm run build:ios -- --ci --target aarch64 --export-method app-store-connect --build-number "$GITHUB_RUN_NUMBER" -- --locked
      - name: Collect simulator
        if: ${{ !inputs.release }}
        run: node scripts/collect-release.mjs ios-simulator ios-output
      - name: Collect signed IPA
        if: inputs.release
        run: node scripts/collect-release.mjs ios src-tauri/gen/apple/build
      - uses: actions/upload-artifact@v4
        with:
          name: installers-ios
          path: release-assets/*
          if-no-files-found: error
          retention-days: 14

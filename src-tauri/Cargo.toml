[package]
name = "yummywatch"
version = "0.0.4"
description = "YummyWatch anime application"
edition = "2021"
rust-version = "1.90"

[lib]
name = "yummywatch_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync", "time", "macros", "net", "io-util"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "json", "gzip"] }
regex = "1"
url = "2"
rand = "0.9"
base64 = "0.22"

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"

[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.3", default-features = false, features = ["NSWindow", "NSButton", "NSView", "NSControl", "NSResponder", "NSCursor"] }

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true

# Full debug info and incremental copies of the media backend quickly use GBs.
[profile.dev]
debug = 1
incremental = false
